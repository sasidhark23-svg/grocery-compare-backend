spring.application.name=backend

# Default Datasource: H2 In-Memory Database (Runs instantly out-of-the-box without requiring a running local MySQL service)
spring.datasource.url=jdbc:h2:mem:grocerycompare;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Cache Configuration
spring.cache.type=none

# JWT Configuration (Safe default fallback for zero-config startup)
jwt.secret=${JWT_SECRET:GroceryCompareSecretKeyForJWTAuthenticatingUserTokens1234567890!}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
app.demo-users.enabled=${DEMO_USERS_ENABLED:true}

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
