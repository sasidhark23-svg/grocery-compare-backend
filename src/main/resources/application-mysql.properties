spring.application.name=backend

# MySQL Profile Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOSTPORT:localhost:3306}/${DB_NAME:grocerycompare}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.cache.type=none
jwt.secret=${JWT_SECRET:GroceryCompareSecretKeyForJWTAuthenticatingUserTokens1234567890!}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
